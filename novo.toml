[package]
name        = "smp-client-nv"
version     = "0.1.3"
description = "The client half of SMP, the Simple Management Protocol of MCUmgr: a library whose commands of the OS, image and file groups return values, with upload, resume and progress, over a Transport trait that has the console framing over a serial port, a pty or a TCP socket, the packets as they are over a pipe and a script for tests and, over the Central of ble-central-nv, Bluetooth Low Energy, and a program may implement it for another link; and two programs: smp-client-nv, which also packs the file nRF Connect Device Manager reads, and novo-update, which the toolchain runs as `novo update` to update a board and write its data region."
license     = "Apache-2.0"
stability   = "experimental"

# `host`: a client opens a serial port, a socket or a pipe, reads and writes files and prints.
layer       = "host"

category    = "embedded"
tags        = ["mcumgr", "smp", "dfu", "fota", "firmware-update", "bootloader", "serial", "bluetooth", "ble", "client", "cli"]
repository  = "https://github.com/novolang/smp-client-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.26.0"

# The command `smp-client-nv`: echo, params, reset, image list/upload/test/confirm/erase, fs upload/download/status/hash/close, pack and unpack,
# over a serial port, a TCP socket, a descriptor or a pipe.
main        = "src/main.nv"

# `novo update`: the command the toolchain runs for a verb it does not know, built as `novo-update` and installed beside `novo`.
[[bin]]
name = "novo-update"
path = "src/update_main.nv"

[docs.pages]
"README.md" = "The client half of SMP, for a host"

[dependencies]
# The protocol: the header, the CBOR of a body, the console framing and the request builders, and the server the suites run the client against.
mcumgr-nv = "^0.2.0"

# The Central that smpgatt.nv carries SMP over: the GATT operations of Bluetooth LE as a trait, which the noble Host, a phone's Bluetooth API
# and a test double implement.  The package holds no stack, so the README's statement that this package knows no radio stays true.
#
# ble-central-nv 0.1.1 is the first version whose functions say `@tier(app)`: a project at the embedded tier that holds 0.1.0 fails its build on
# them, so the range starts at 0.1.1 and a resolver cannot pick 0.1.0.
ble-central-nv = "^0.1.1"
